[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131B2B"
textColor = "#F2F5FA"
font = "sans serif"

[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 15
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
